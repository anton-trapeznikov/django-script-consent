[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-script-consent"
version = "0.2.1"
description = "Django CMP: granular script consent with strict binding to active HTML/JS snippets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Anton Trapeznikov", email = "i@anton-trapeznikov.ru" },
]
maintainers = [
    { name = "Anton Trapeznikov", email = "i@anton-trapeznikov.ru" },
]
keywords = [
    "django",
    "cookie",
    "consent",
    "script",
    "privacy",
    "gdpr",
    "banner",
    "cmp",
    "analytics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "Django>=4.2,<6",
]

[project.optional-dependencies]
dev = [
    "Django>=4.2,<6",
    "black",
    "build",
    "coverage",
    "django-stubs[compatible-mypy]",
    "isort",
    "mypy",
    "ruff",
    "twine",
]
test = [
    "coverage",
]

[project.urls]
Homepage = "https://gitverse.ru/lesbeg/django-script-consent"
Repository = "https://gitverse.ru/lesbeg/django-script-consent"
Issues = "https://gitverse.ru/lesbeg/django-script-consent/issues"
Mirror = "https://github.com/anton-trapeznikov/django-script-consent"

[tool.setuptools.packages.find]
include = ["script_consent*"]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    "**/migrations/*",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "SIM", # simplify
    "PIE", # flake8-pie
]
ignore = [
    "RUF012", # mutable class attributes are idiomatic in Django Meta/admin
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
extend-exclude = """
/(
    migrations
  | \\.venv
  | build
  | dist
)/
"""

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["script_consent", "tests"]
skip = ["migrations", ".venv", "build", "dist"]

[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main"]
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "script_consent.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.setuptools.package-data]
script_consent = [
    "templates/**/*",
    "static/**/*",
    "migrations/*.py",
    "locale/**/*",
]

[tool.setuptools.exclude-package-data]
script_consent = [
    "static/**/*.test.js",
    "**/__pycache__/*",
    "**/*.py[cod]",
]
